<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hệ thống OMR</title>

    <link th:href="@{/assets/img/logo.png}" rel="icon">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            max-width: 480px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-circle {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: white;
            margin: 0 auto 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .login-header h2 {
            font-size: 32px;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .login-header .subtitle {
            color: #718096;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: #2d3748;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #718096;
            font-size: 20px;
            z-index: 1;
        }

        .form-group input {
            width: 100%;
            padding: 15px 50px 15px 50px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .show-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 20px;
            user-select: none;
            z-index: 2;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #2d3748;
            font-size: 14px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .forgot-password {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e2e8f0;
        }

        .divider span {
            background: white;
            padding: 0 15px;
            color: #718096;
            font-size: 14px;
            position: relative;
            z-index: 1;
        }

        .social-login {
            margin-bottom: 25px;
        }

        .social-btn {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            color: #2d3748;
        }

        .social-btn:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .register-link {
            text-align: center;
            color: #718096;
            font-size: 14px;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .register-link a:hover {
            color: #764ba2;
        }

        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .back-home:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .error-message {
            color: #ef4444;
            font-size: 13px;
            margin-top: 5px;
            padding: 8px 12px;
            background: #fee;
            border-radius: 6px;
            display: none;
        }

        .success-message {
            color: #10b981;
            font-size: 13px;
            margin-top: 5px;
            padding: 8px 12px;
            background: #d1fae5;
            border-radius: 6px;
            display: none;
        }

        @media (max-width: 768px) {
            .login-container {
                padding: 40px 30px;
            }

            .back-home {
                position: fixed;
            }
        }
    </style>
</head>
<body>
<a href="/home" class="back-home">← Về trang chủ</a>

<div class="login-container">
    <div class="login-header">
        <img th:src="@{/assets/img/logo.png}" alt="OMR Logo" style="height: 40px;">
        <h2>Đăng nhập</h2>
        <p class="subtitle">Chào mừng bạn quay trở lại!</p>
    </div>

    <form id="loginForm" method="post" th:action="@{/login}">
        <div class="form-group">
            <label>Email hoặc Tên đăng nhập</label>
            <div class="input-wrapper">
                <span class="input-icon">👤</span>
                <input type="text" id="username" name="username" placeholder="Nhập email hoặc tên đăng nhập" required autocomplete="username">
            </div>
            <div class="error-message" id="usernameError">Vui lòng nhập email hoặc tên đăng nhập</div>
        </div>

        <div class="form-group">
            <label>Mật khẩu</label>
            <div class="input-wrapper">
                <span class="input-icon">🔒</span>
                <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required minlength="6" autocomplete="current-password">
                <span class="show-password" onclick="togglePassword()">👁️</span>
            </div>
            <div class="error-message" id="passwordError">Mật khẩu phải có ít nhất 6 ký tự</div>
        </div>

        <div class="form-options">
            <label class="remember-me">
                <input type="checkbox" id="remember">
                <span>Ghi nhớ đăng nhập</span>
            </label>
            <a href="#" class="forgot-password" onclick="handleForgotPassword(); return false;">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="btn-login">Đăng nhập</button>

        <div class="success-message" id="successMessage">Đang chuyển hướng...</div>
        <div class="error-message" id="loginError">Email hoặc mật khẩu không chính xác</div>

        <div class="divider">
            <span>Hoặc đăng nhập với</span>
        </div>

        <div class="social-login">
            <button type="button" class="social-btn" onclick="loginWithGoogle()">
                <span style="font-size: 20px;">🔍</span>
                Đăng nhập bằng Google
            </button>
        </div>

        <div class="register-link">
            Chưa có tài khoản? <a href="/register">Đăng ký ngay</a>
        </div>
    </form>
</div>

<script>
    // Toggle hiển thị mật khẩu
    function togglePassword() {
        const passwordField = document.getElementById('password');
        const toggleIcon = document.querySelector('.show-password');

        if (passwordField.type === 'password') {
            passwordField.type = 'text';
            toggleIcon.textContent = '🙈';
        } else {
            passwordField.type = 'password';
            toggleIcon.textContent = '👁️';
        }
    }

    // Xử lý quên mật khẩu
    function handleForgotPassword() {
        const email = prompt('Nhập email của bạn để nhận link đặt lại mật khẩu:');

        if (email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (emailRegex.test(email)) {
                alert('Link đặt lại mật khẩu đã được gửi đến email: ' + email);
            } else {
                alert('Email không hợp lệ. Vui lòng thử lại!');
            }
        }
    }

    // Xử lý đăng nhập
    function handleLogin(event) {
        event.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const remember = document.getElementById('remember').checked;

        // Reset error messages
        document.getElementById('usernameError').style.display = 'none';
        document.getElementById('passwordError').style.display = 'none';
        document.getElementById('loginError').style.display = 'none';

        // Validate
        if (!username) {
            document.getElementById('usernameError').style.display = 'block';
            return;
        }

        if (password.length < 6) {
            document.getElementById('passwordError').style.display = 'block';
            return;
        }

        // Giả lập đăng nhập
        const btn = event.target.querySelector('.btn-login');
        const originalText = btn.textContent;
        btn.textContent = 'Đang xử lý...';
        btn.disabled = true;

        // Giả lập kiểm tra thông tin đăng nhập
        setTimeout(() => {
            // Demo: Chấp nhận bất kỳ email/username và password >= 6 ký tự
            const isValid = password.length >= 6;

            if (isValid) {
                // Lưu thông tin nếu chọn ghi nhớ
                if (remember) {
                    localStorage.setItem('rememberedUser', username);
                }

                // Hiển thị thông báo thành công
                document.getElementById('successMessage').style.display = 'block';

                setTimeout(() => {
                    alert('Đăng nhập thành công!');
                    // Chuyển hướng đến trang dashboard
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                // Hiển thị lỗi
                document.getElementById('loginError').style.display = 'block';
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }, 1500);
    }

    // Đăng nhập bằng Google
    function loginWithGoogle() {
        alert('Chức năng đăng nhập bằng Google đang được phát triển...');
        // Thực tế sẽ tích hợp Google OAuth
    }

    // Tự động điền thông tin nếu đã lưu
    window.onload = function() {
        const rememberedUser = localStorage.getItem('rememberedUser');
        if (rememberedUser) {
            document.getElementById('username').value = rememberedUser;
            document.getElementById('remember').checked = true;
        }
    };

    // Xử lý Enter key
    document.getElementById('password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        }
    });
</script>
</body>
</html>
